# Conventions this project takes from app-tooling, beyond what peru.yaml
# records. docs/app-tooling/pattern-imports/README.md explains this file.

[patterns.pattern-imports]

# The Mac half only; an iOS app added later follows the pattern's apply.md
# (docs/app-tooling/git-commit-stamp/apply.md) for the rest.
[patterns.git-commit-stamp]

# No LM_SKIP_METADATA_EXTRACTION: the only xcodebuild, check-shared-ios, builds
# a package's library targets, which do not print the warning.
[patterns.build-warnings]

# Sandboxed: the inbox is ~/Library/Caches/Starter-scratch/Commands, passed by
# run-scratch as --commands and opened to the app by a temporary exception in
# StarterMac.entitlements (kept in the one entitlements file: the starter is
# distributed with Developer ID, not through the App Store). No snapshot.
[patterns.command-inbox]
params = { package = "Packages/StarterKit", notification = "org.example.starter.commands", dir = "~/Library/Caches/Starter-scratch/Commands" }

# Installs the everyday build, which passes MAC_INSTALL_BUILD_NUMBER to
# build.sh as BUILD_NUMBER.
[patterns.mac-install]

# The scratch build, "Starter Scratch" (org.example.starter.scratch), made from
# build/Starter.app by scripts/make-scratch-app.sh (`make build-scratch`).
# Sandboxed: its database and defaults are in its own container.
[patterns.scratch-data]
params = { swift_dir = "Packages/StarterKit/Sources/Core" }

# In the Mac package, not the shared one: the menu-bar badge has an
# `#if os(macOS)`, which rules/platform-conditionals.yml ignores for that
# file only. The icon is the .icns of make-icon.swift, banded by
# make-scratch-app.sh at every build; there is no asset catalog.
[patterns.scratch-look]
params = { banner_dir = "Packages/StarterMacKit/Sources/MacUI" }
