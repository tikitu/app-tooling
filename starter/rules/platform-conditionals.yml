id: platform-conditionals
language: swift
severity: error
message: "Platform code goes in its platform's package, not behind #if os/canImport/targetEnvironment."
note: |
  StarterKit is shared (and compiled for iOS by `make check`); StarterMacKit is macOS only.
  Read rules/platform-conditionals.md before working around this.
rule:
  kind: directive
  regex: '^#(if|elseif)\b.*\b(os|canImport|targetEnvironment)\s*\('
# Imported from app-tooling (scratch-look), which cannot carry an ignore
# comment; rules/platform-conditionals.md, "Known exceptions".
ignores:
  - Packages/StarterMacKit/Sources/MacUI/ScratchMenuBarBadge.swift
