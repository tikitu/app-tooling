rules:
  - id: database-write-outside-the-model
    languages: [swift]
    severity: ERROR
    message: >-
      A database write in a view is a control that bypasses
      `AppModel.perform(_:)`: a path no script can reach, and so a path
      nobody checks. Add an `AppCommand` for it and perform that.

      Why this matters, and the cases where it is fine:
      semgrep/docs/writes-outside-the-model.md
    paths:
      include:
        - "**/Sources/UI/**"
        - "**/Sources/MacUI/**"
      exclude:
        - "**/Sources/UI/AppModel.swift"
    patterns:
      - pattern-either:
          - pattern: $DB.write { ... }
          - pattern: $DB.write(...)
      # Writing a file (`Data.write(to:)`, the command inbox's result) is not
      # a database write.
      - pattern-not: "$X.write(to: ...)"
      - pattern-not: "$X.write(to: ..., options: ...)"
