# Conventions taken from app-tooling; see
# docs/app-tooling/pattern-imports/README.md.
imports:
    app-tooling|pattern-imports: ./
    app-tooling|pattern-imports-docs: docs/app-tooling/pattern-imports/
    app-tooling|git-commit-stamp: ./
    app-tooling|git-commit-stamp-docs: docs/app-tooling/git-commit-stamp/
    app-tooling|build-warnings: ./
    app-tooling|build-warnings-docs: docs/app-tooling/build-warnings/
    app-tooling|command-inbox: ./
    app-tooling|command-inbox-docs: docs/app-tooling/command-inbox/
    app-tooling|mac-install: ./
    app-tooling|mac-install-docs: docs/app-tooling/mac-install/
    app-tooling|scratch-data: ./
    app-tooling|scratch-data-docs: docs/app-tooling/scratch-data/
    app-tooling|scratch-data-swift: Packages/StarterKit/Sources/Core/
    app-tooling|scratch-look: ./
    app-tooling|scratch-look-docs: docs/app-tooling/scratch-look/
    app-tooling|scratch-look-swift: Packages/StarterMacKit/Sources/MacUI/
    app-tooling|mac-dist: ./
    app-tooling|mac-dist-docs: docs/app-tooling/mac-dist/

git module app-tooling:
    url: https://github.com/tikitu/app-tooling
    reup: developer-id-release
    rev: cdf894cad54b47b46c4f56f5fb5ce347519875df

rule pattern-imports:
    export: patterns/pattern-imports/files
rule pattern-imports-docs:
    pick: [patterns/pattern-imports/README.md, patterns/pattern-imports/apply.md, patterns/pattern-imports/CHANGELOG.md]
    export: patterns/pattern-imports

rule git-commit-stamp:
    export: patterns/git-commit-stamp/files
rule git-commit-stamp-docs:
    pick: [patterns/git-commit-stamp/README.md, patterns/git-commit-stamp/apply.md, patterns/git-commit-stamp/CHANGELOG.md]
    export: patterns/git-commit-stamp

rule build-warnings:
    export: patterns/build-warnings/files
rule build-warnings-docs:
    pick: [patterns/build-warnings/README.md, patterns/build-warnings/apply.md, patterns/build-warnings/CHANGELOG.md]
    export: patterns/build-warnings

rule command-inbox:
    export: patterns/command-inbox/files
rule command-inbox-docs:
    pick: [patterns/command-inbox/README.md, patterns/command-inbox/apply.md, patterns/command-inbox/CHANGELOG.md, patterns/command-inbox/guide.md]
    export: patterns/command-inbox

rule mac-install:
    export: patterns/mac-install/files
rule mac-install-docs:
    pick: [patterns/mac-install/README.md, patterns/mac-install/apply.md, patterns/mac-install/CHANGELOG.md]
    export: patterns/mac-install

rule scratch-data:
    export: patterns/scratch-data/files
rule scratch-data-docs:
    pick: [patterns/scratch-data/README.md, patterns/scratch-data/apply.md, patterns/scratch-data/CHANGELOG.md]
    export: patterns/scratch-data
rule scratch-data-swift:
    export: patterns/scratch-data/swift

rule scratch-look:
    export: patterns/scratch-look/files
rule scratch-look-docs:
    pick: [patterns/scratch-look/README.md, patterns/scratch-look/apply.md, patterns/scratch-look/CHANGELOG.md]
    export: patterns/scratch-look
rule scratch-look-swift:
    export: patterns/scratch-look/swift

rule mac-dist:
    export: patterns/mac-dist/files
rule mac-dist-docs:
    pick: [patterns/mac-dist/README.md, patterns/mac-dist/apply.md, patterns/mac-dist/CHANGELOG.md]
    export: patterns/mac-dist
